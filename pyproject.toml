[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "f1"
version = "0.1.0"
description = "F1 data client and CLI for OpenF1 API"
authors = ["William Lacerda de Souza <willdesouza04@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "f1", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
requests = ">=2.31.0"
click = ">=8.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
pytest = ">=7.0"
pytest-cov = ">=4.0"
mkdocs = ">=1.5"
mkdocs-material = ">=9.0"

[tool.poetry.scripts]
f1 = "f1.cli:main"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/f1 --cov-report=term-missing --cov-report=html --cov-fail-under=50"

[tool.coverage.run]
source = ["src/f1"]
branch = true
